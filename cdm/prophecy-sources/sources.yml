---
version: 2
sources:
- name: "waterfall_harmonizer_cdm"
  database: "waterfall-harmonizer"
  schema: "cdm"
  config:
    tags:
    - "source:waterfall_harmonizer_cdm"
  tables:
  - name: "all_cols"
    tests: []
    config:
      tags:
      - "pipeline:cdm_pipe_waterfall"
      - "table:all_cols"
      - "pipeline:wf_cdm_target"
      - "pipeline:ref_pipe_waterfall"
    columns:
    - name: "4506T Flag"
      description: "Boolean indicator of whether a Transcript of Tax Return (received\
        \ pursuant to the filing of IRS Form 4506-T) was obtained and considered."
      quote: true
      dataType:
        type: "Boolean"
    - name: "ARM Index"
      description: "Specifies the type of index used to determine the interest rate\
        \ at each adjustment period for adjustable rate mortgages."
      tags:
      - "column:ARM_Index"
      tests:
      - expression_is_true:
          config:
            fail_calc: "count(*)"
            tags:
            - "test:expression_is_true"
          expression: "> 0 and `ARM Index` < 10"
      quote: true
      dataType:
        type: "String"
    - name: "ARM Initial Fixed Rate Period"
      description: "Original number of months until the first rate adjustment in a\
        \ hybrid adjustable-rate mortgage (e.g., 5/25 ARM)"
      quote: true
      dataType:
        type: "Integer"
    - name: "ARM Initial Rate Adj Cap"
      description: "Maximum percentage by which the note rate may change at the first\
        \ rate adjustment date in an adjustable-rate mortgage."
      quote: true
      dataType:
        type: "Integer"
    - name: "ARM Lookback Days"
      description: "The number of days prior to the interest rate adjustment date\
        \ to retrieve the index value."
      quote: true
      dataType:
        type: "Integer"
    - name: "ARM Margin"
      description: "The percentage spread between the ARM Index value and the mortgage\
        \ interest rate, as stated on the mortgage note."
      quote: true
      dataType:
        type: "Integer"
    - name: "ARM Max Rate"
      description: "The maximum interest rate that can be in effect during the life\
        \ of an adjustable-rate mortgage (ARM) loan."
      quote: true
      dataType:
        type: "Integer"
    - name: "ARM Min Rate"
      description: "The minimum interest rate that can be in effect during the life\
        \ of an adjustable-rate mortgage (ARM) loan; also known as the lifetime floor\
        \ rate."
      quote: true
      dataType:
        type: "Integer"
    - name: "ARM Periodic Cap"
      description: "Maximum percentage by which the note rate may change at each rate\
        \ adjustment date in an adjustable rate mortgage (ARM)."
      quote: true
      dataType:
        type: "Integer"
    - name: "ARM Rate Adj Frequency"
      description: "Specifies the number of months between each subsequent rate adjustment\
        \ in an adjustable-rate mortgage (ARM) product."
      quote: true
      dataType:
        type: "Integer"
    - name: "ARM Round Factor"
      description: "The percentage to which an adjusted interest rate is to be rounded\
        \ in adjustable rate mortgage products."
      quote: true
      dataType:
        type: "Integer"
    - name: "ARM Round Flag"
      description: "Indicator of the rounding method applied to an adjusted interest\
        \ rate in an ARM (Adjustable Rate Mortgage), specifying whether rounding occurs\
        \ to the next higher round factor, next lower round factor, or nearest round\
        \ factor."
      quote: true
      dataType:
        type: "Boolean"
    - name: "As Of Date"
      description: "Reference date for loan balance, servicing metrics, and other\
        \ reported data; typically the month-end or reporting cutoff date."
      quote: true
      dataType:
        type: "Date"
    - name: "BPO Date"
      description: "Internal SItusAMC data point representing the current valuation\
        \ date of the property across all data sources."
      quote: true
      dataType:
        type: "Date"
    - name: "BPO Value"
      description: "Current valuation of the property from Broker Price Opinion (BPO)\
        \ data across all available sources"
      quote: true
      dataType:
        type: "Float"
    - name: "Borr 1 Asset Verification"
      description: "Indicates the extent to which the primary borrower's assets have\
        \ been verified."
      quote: true
      dataType:
        type: "String"
    - name: "Borr 1 Credit Score"
      description: "Most recent primary borrower credit score (FICO)"
      quote: true
      dataType:
        type: "Integer"
    - name: "Borr 1 Credit Score Date"
      description: "Date on which the most recent primary borrower's credit score\
        \ (FICO) was obtained"
      quote: true
      dataType:
        type: "Date"
    - name: "Borr 1 Employment Verification"
      description: "Indicates the extent to which the primary borrower's employment\
        \ has been verified"
      quote: true
      dataType:
        type: "String"
    - name: "Borr 1 Income Verification"
      description: "Indicates the extent to which the primary borrower's income has\
        \ been verified."
      quote: true
      dataType:
        type: "String"
    - name: "Borr 1 Length of Employment"
      description: "The number of years of service with the primary borrower's current\
        \ employer as of the loan date."
      quote: true
      dataType:
        type: "Integer"
    - name: "Borr 1 Other Income"
      description: "Monthly non-wage income amount for the primary borrower."
      quote: true
      dataType:
        type: "Integer"
    - name: "Borr 1 Residency Status"
      description: "Classification of the primary borrower's residency and citizenship\
        \ status (e.g., US Citizen, Foreign National, Permanent Resident)"
      quote: true
      dataType:
        type: "String"
    - name: "Borr 1 Wage Income"
      description: "Monthly base wage income for the primary borrower."
      quote: true
      dataType:
        type: "Integer"
    - name: "Borr 2 Asset Verification"
      description: "Asset verification status or classification for the second borrower\
        \ in a loan application."
      quote: true
      dataType:
        type: "String"
    - name: "Borr 2 Credit Score"
      description: "Most recent credit score for the co-borrower (secondary borrower)"
      quote: true
      dataType:
        type: "Integer"
    - name: "Borr 2 Employment Verification"
      description: "Employment verification status or method for the second borrower"
      quote: true
      dataType:
        type: "String"
    - name: "Borr 2 Income Verification"
      description: "Verification status or level of income documentation for a co-borrower\
        \ or second borrower"
      quote: true
      dataType:
        type: "String"
    - name: "Borr 2 Length of Employment"
      description: "The number of years of service with the co-borrower's current\
        \ employer as of the loan date."
      quote: true
      dataType:
        type: "Integer"
    - name: "Borr 2 Other Income"
      description: "Monthly other (non-wage) income for all other borrowers (co-borrowers)."
      quote: true
      dataType:
        type: "Integer"
    - name: "Borr 2 Residency Status"
      description: "Classification of coborrower (secondary borrower) residency and\
        \ citizenship status (e.g., US Citizen, Foreign National, Permanent Resident)"
      quote: true
      dataType:
        type: "String"
    - name: "Borr 2 Wage Income"
      description: "Monthly base wage income for all other borrowers (co-borrowers)."
      quote: true
      dataType:
        type: "Integer"
    - name: "Broker Flag"
      description: "Indicates whether a broker took the application."
      quote: true
      dataType:
        type: "Boolean"
    - name: "Buydown Period"
      description: "Term in months for how long the rate of the loan has been temporarily\
        \ bought down to a lower coupon"
      quote: true
      dataType:
        type: "Integer"
    - name: "CRE Financials: UW DSCR (NOI)"
      description: "Underwritten or Original Debt Service Coverage Ratio calculated\
        \ based on Net Operating Income"
      quote: true
      dataType:
        type: "Integer"
    - name: "Cash Out Amount"
      description: "The net cash amount disbursed to borrower in a cash-out refinance,\
        \ calculated as: New Loan Amount minus Paid-Off Senior Loan Amount minus Paid-Off\
        \ Junior Loan Amounts minus Closing Costs"
      quote: true
      dataType:
        type: "Float"
    - name: "Credit Line Usage Ratio"
      description: "Measure of credit utilization, calculated as the sum of credit\
        \ balances divided by sum of total open credit available."
      quote: true
      dataType:
        type: "Integer"
    - name: "Credit: Longest Trade Line"
      description: "Credit bureau information representing the age or duration of\
        \ the longest active trade line on the borrower's credit profile"
      quote: true
      dataType:
        type: "Integer"
    - name: "Credit: Maximum Trade Line"
      description: "Maximum trade line amount from credit bureau information"
      quote: true
      dataType:
        type: "Float"
    - name: "Credit: Number of Trade Lines"
      description: "Count of open trade lines from credit bureau data; indicates borrower's\
        \ active credit accounts"
      quote: true
      dataType:
        type: "Integer"
    - name: "Curr Balloon Flag"
      description: "Indicator of whether there is a scheduled balloon payment for\
        \ the loan."
      quote: true
      dataType:
        type: "Boolean"
    - name: "Curr CLTV"
      description: "Current Combined Loan-to-Value ratio; represents the sum of senior\
        \ and junior unpaid principal balance divided by current property value"
      quote: true
      dataType:
        type: "Integer"
    - name: "Curr LTV"
      description: "Current Loan-to-Value ratio; represents current outstanding principal\
        \ balance divided by current property value"
      quote: true
      dataType:
        type: "Integer"
    - name: "Curr Loan Balance"
      description: "Unpaid principal balance of the current loan, excluding deferred\
        \ or non-interest accruing amounts"
      quote: true
      dataType:
        type: "Float"
    - name: "Curr Loan Interest Rate"
      description: "The interest rate used to calculate the current principal and\
        \ interest payment on the loan."
      quote: true
      dataType:
        type: "Integer"
    - name: "Curr Occupancy Status"
      description: "Latest occupancy status indicating whether a property is occupied\
        \ by owner, second home, or investor"
      quote: true
      dataType:
        type: "String"
    - name: "Curr PI Payment"
      description: "Contractual monthly Principal and Interest payment amount"
      quote: true
      dataType:
        type: "Float"
    - name: "Curr Payment Paid Thru Date"
      description: "The date through which all principal and interest payments have\
        \ been paid up to; typically one period behind the next due date for active\
        \ loans."
      quote: true
      dataType:
        type: "Date"
    - name: "Curr Servicer Delinquency Status"
      description: "Represents the current delinquency status of a loan as reported\
        \ by the servicer. Raw indicator used to derive or validate loan status, particularly\
        \ in RMBS contexts."
      quote: true
      dataType:
        type: "String"
    - name: "Current FICO"
      description: "Current FICO credit score of the borrower; represents the most\
        \ recent credit rating used in underwriting."
      quote: true
      dataType:
        type: "Integer"
    - name: "Current FICO Date"
      description: "The date associated with the most recent FICO credit score for\
        \ the primary borrower."
      quote: true
      dataType:
        type: "Date"
    - name: "Current Other Payment"
      description: "Monetary amount representing current other payments (non-primary\
        \ payment obligations)."
      quote: true
      dataType:
        type: "Float"
    - name: "Current Payment Amount Due"
      description: "The monetary amount currently due as a payment obligation."
      quote: true
      dataType:
        type: "Float"
    - name: "DD: Compliance Event Grade"
      description: "Grade or rating assigned to a compliance event identified during\
        \ due diligence review of a loan."
      quote: true
      dataType:
        type: "String"
    - name: "DD: Credit Event Grade"
      description: "Classification or grading of credit events identified during due\
        \ diligence review of a loan."
      quote: true
      dataType:
        type: "String"
    - name: "DD: Overall Grade"
      description: "Overall grade or rating assessment from due diligence process"
      quote: true
      dataType:
        type: "String"
    - name: "DD: Property Event Grade"
      description: "Due diligence assessment grade for a property event, used in loan\
        \ review processes."
      quote: true
      dataType:
        type: "String"
    - name: "DTI Ratio"
      description: "Back-end debt-to-income ratio; total monthly debt expense divided\
        \ by total monthly income, used for loan qualification"
      tags:
      - "column:DTI_Ratio"
      tests:
      - dbt_utils.expression_is_true:
          config:
            fail_calc: "count(*)"
            tags:
            - "test:dbt_utils.expression_is_true"
          expression: ">0 and `DTI Ratio` < 100"
      quote: true
      dataType:
        type: "Integer"
    - name: "Doc Type"
      description: "Documentation level classification at loan origination (e.g.,\
        \ Full, Stated, Limited, No Doc, SISA)."
      quote: true
      dataType:
        type: "String"
    - name: "Escrow Advance Balance"
      description: "Funds advanced for taxes and insurance held in escrow account"
      quote: true
      dataType:
        type: "Float"
    - name: "Escrow Flag"
      description: "Indicates whether homeownership expenses are paid by the borrower\
        \ directly or through an escrow account at securitization cut-off date."
      quote: true
      dataType:
        type: "Boolean"
    - name: "Financing: Advance Rate"
      description: "Advance Rate for WAM (Warehouse) financing terms"
      quote: true
      dataType:
        type: "Integer"
    - name: "First-time Home Buyer"
      description: "Indicator of whether the borrower is a first-time home buyer."
      quote: true
      dataType:
        type: "Boolean"
    - name: "Forbearance Type"
      description: "Categorical indicator of the type of forbearance granted on a\
        \ student loan account."
      quote: true
      dataType:
        type: "String"
    - name: "High Cost Flag"
      description: "Indicator of whether a loan is classified as a federal or state\
        \ high cost loan."
      quote: true
      dataType:
        type: "Boolean"
    - name: "Init Fixed Payment Period"
      description: "Specifies the initial period during which fixed payments are applied\
        \ (relevant to negative amortization loan products)."
      quote: true
      dataType:
        type: "Integer"
    - name: "Init Min Payment"
      description: "Initial minimum payment amount for a loan or mortgage product."
      quote: true
      dataType:
        type: "Integer"
    - name: "Init NegAm Recast Period"
      description: "Represents the initial negative amortization recast period, calculated\
        \ as the number of months between the original first payment date and the\
        \ negative amortization initial recast date."
      quote: true
      dataType:
        type: "Integer"
    - name: "Init Periodic Pay Cap"
      description: "Initial periodic payment cap value for negative amortization loans"
      quote: true
      dataType:
        type: "Integer"
    - name: "LOC Draw Period"
      description: "Duration period during which funds can be drawn from a Line of\
        \ Credit, expressed in months"
      quote: true
      dataType:
        type: "Integer"
    - name: "Lien Position"
      description: "Numeric indicator of the loan's lien position in the mortgage\
        \ hierarchy (1 = first lien, 2 = second lien, etc.)"
      quote: true
      dataType:
        type: "String"
    - name: "Line of Credit Flag"
      description: "Indicator that loan has a Line of Credit feature (HELOCs, Reverse\
        \ mortgages, etc.)"
      quote: true
      dataType:
        type: "Boolean"
    - name: "Liquid / Cash Reserves"
      description: "Dollar amount of remaining verified liquid assets available after\
        \ settlement, excluding cash-out from the subject loan."
      quote: true
      dataType:
        type: "Float"
    - name: "Loan Purpose"
      description: "Indicates the purpose of the loan (e.g., purchase, refinance,\
        \ cash-out)."
      quote: true
      dataType:
        type: "String"
    - name: "MI Cert Num"
      description: "The unique number assigned to each individual loan insured under\
        \ a mortgage insurance (MI) policy."
      quote: true
      dataType:
        type: "String"
    - name: "MI Company"
      description: "The name of the entity providing mortgage insurance for a loan."
      quote: true
      dataType:
        type: "String"
    - name: "MI Coverage Pct"
      description: "Mortgage Insurance coverage percentage."
      quote: true
      dataType:
        type: "Integer"
    - name: "Mod Capitalized Amount"
      description: "The principal amount capitalized (added to loan balance) as part\
        \ of a loan modification, typically in distressed servicing scenarios."
      quote: true
      dataType:
        type: "Float"
    - name: "Mod Deferred Amount"
      description: "Dollar amount of principal or payments deferred as part of a loan\
        \ modification."
      quote: true
      dataType:
        type: "Float"
    - name: "Modification Flag"
      description: "Indicator that the loan has been modified."
      quote: true
      dataType:
        type: "Boolean"
    - name: "Monthly Debt All Borrowers"
      description: "Aggregate monthly debt service obligations across all borrowers\
        \ on the loan."
      quote: true
      dataType:
        type: "Float"
    - name: "Months Since BK Discharge"
      description: "Number of months elapsed since any borrower was discharged from\
        \ bankruptcy"
      quote: true
      dataType:
        type: "Integer"
    - name: "Months Since FC Sale"
      description: "Number of months elapsed since the foreclosure sale date."
      quote: true
      dataType:
        type: "Integer"
    - name: "NegAm Limit"
      description: "Negative amortization limit, maximum, or cap threshold for a loan\
        \ product"
      quote: true
      dataType:
        type: "Integer"
    - name: "Number Of Properties"
      description: "Count of properties associated with a loan or borrower collateral\
        \ portfolio"
      quote: true
      dataType:
        type: "Integer"
    - name: "Number of Borrowers"
      description: "Count of borrowers obligated to repay the note"
      quote: true
      dataType:
        type: "Integer"
    - name: "OptionARM Flag"
      description: "Indicator of whether a loan product is an Option ARM (Negative\
        \ Amortization Adjustable Rate Mortgage)."
      quote: true
      dataType:
        type: "Boolean"
    - name: "Orig Amortization Term"
      description: "The number of months over which the loan principal and interest\
        \ would be fully amortized with regular monthly payments. Typically shorter\
        \ than total loan term for balloon loans."
      quote: true
      dataType:
        type: "Integer"
    - name: "Orig Amortization Type"
      description: "Identifies the original amortization schedule type for a loan\
        \ (Fixed, Adjustable/ARM, Balloon, etc.)"
      quote: true
      dataType:
        type: "String"
    - name: "Orig Appraisal Date"
      description: "The appraised value date of the property used to approve the loan\
        \ at origination."
      quote: true
      dataType:
        type: "Date"
    - name: "Orig Appraisal Value"
      description: "The appraised value of the property used to approve the loan."
      quote: true
      dataType:
        type: "Float"
    - name: "Orig CLTV"
      description: "Combined Loan-to-Value ratio; calculated as the sum of all loan\
        \ liens divided by the lesser of original sales price or appraised value."
      quote: true
      dataType:
        type: "Integer"
    - name: "Orig Channel"
      description: "The source or channel through which the mortgage loan was originated\
        \ (e.g., Retail, Broker, etc.)"
      quote: true
      dataType:
        type: "String"
    - name: "Orig First Payment Date"
      description: "The date of the first scheduled payment to be made by the borrower\
        \ as specified on the note at loan origination."
      quote: true
      dataType:
        type: "Date"
    - name: "Orig Interest Only Term"
      description: "Original interest-only period for a loan, measured in months.\
        \ Applies to all loan types including Negative Amortization loans."
      quote: true
      dataType:
        type: "Integer"
    - name: "Orig Junior Loan Amount"
      description: "Combined balance of subordinate liens (junior mortgages) at the\
        \ time of origination for first mortgages with multiple liens."
      quote: true
      dataType:
        type: "Float"
    - name: "Orig LTV"
      description: "Original Loan-to-Value ratio; calculated as Original Loan Amount\
        \ divided by the lesser of Original Sales Price or Original Appraisal Value.\
        \ Represents the leverage at origination of the mortgage."
      quote: true
      dataType:
        type: "Integer"
    - name: "Orig Loan Amount"
      description: "Dollar amount of the loan as specified on the note at origination.\
        \ For HELOCs, represents the maximum available line of credit. For Reverse\
        \ mortgages, represents the Initial Advance Amount."
      quote: true
      dataType:
        type: "Float"
    - name: "Orig Loan Interest Rate"
      description: "The original note rate at loan origination"
      quote: true
      dataType:
        type: "Integer"
    - name: "Orig Loan Maturity Date"
      description: "The original maturity date of the loan, calculated from loan origination\
        \ parameters or sourced from loan modification records."
      quote: true
      dataType:
        type: "Date"
    - name: "Orig Loan Term"
      description: "The initial number of months between loan origination and loan\
        \ maturity date as specified on the note (Term to Maturity)."
      quote: true
      dataType:
        type: "Integer"
    - name: "Orig Pledged Assets"
      description: "The total value of assets pledged as collateral for the loan at\
        \ the time of origination."
      quote: true
      dataType:
        type: "Integer"
    - name: "Orig Sales Price"
      description: "The original sales price of the property at time of purchase."
      quote: true
      dataType:
        type: "Float"
    - name: "Original FICO"
      description: "The original FICO credit score used for loan qualification of\
        \ the borrower."
      quote: true
      dataType:
        type: "Integer"
    - name: "Original FICO Date"
      description: "The date on which the original FICO credit score was obtained\
        \ or calculated for the borrower."
      quote: true
      dataType:
        type: "Date"
    - name: "Origination Discount Points ($)"
      description: "Amount paid to lender to increase effective yield and reduce borrower\
        \ interest rate"
      quote: true
      dataType:
        type: "Float"
    - name: "Origination Note Date"
      description: "The date on which the loan was originated (note date)."
      quote: true
      dataType:
        type: "Date"
    - name: "Originator Loan Grade"
      description: "Loan grade assigned by the originator"
      quote: true
      dataType:
        type: "String"
    - name: "Originator Name"
      description: "Entity that lends funds to the borrower"
      quote: true
      dataType:
        type: "String"
    - name: "Originator Program"
      description: "Identifies the origination program or product type associated\
        \ with the loan."
      quote: true
      dataType:
        type: "String"
    - name: "Pay History 12 Mths"
      description: "Encodes the payment status or payment record for the past 12 months\
        \ in string format"
      quote: true
      dataType:
        type: "String"
    - name: "Pay History 24 Mths"
      description: "Represents payment status history over the past 24 months as a\
        \ coded string"
      quote: true
      dataType:
        type: "String"
    - name: "Pay History Current for 24"
      description: "Indicator of whether the loan has maintained current payment status\
        \ for the last 24 months (Y/N)."
      quote: true
      dataType:
        type: "Boolean"
    - name: "Prepayment Penalty Description"
      description: "Textual description of how prepayment penalties are calculated\
        \ across different phases of the prepayment penalty term."
      quote: true
      dataType:
        type: "String"
    - name: "Prepayment Penalty Hard Term"
      description: "Specifies the hard term duration for prepayment penalties on the\
        \ loan, indicating the period during which prepayment penalties are fixed\
        \ and non-negotiable."
      quote: true
      dataType:
        type: "Integer"
    - name: "Prepayment Penalty Period"
      description: "The total number of months during which a prepayment penalty may\
        \ be in effect on a loan."
      quote: true
      dataType:
        type: "Integer"
    - name: "Property City"
      description: "The city or municipality where the property is located."
      quote: true
      dataType:
        type: "String"
    - name: "Property State"
      description: "US state location of the property being financed or evaluated."
      quote: true
      dataType:
        type: "String"
    - name: "Property Type"
      description: "Categorical identifier of the property type (e.g., single-family,\
        \ condo, PUD)."
      quote: true
      dataType:
        type: "String"
    - name: "Property Zip"
      description: "Postal zip code of the property location."
      quote: true
      dataType:
        type: "String"
    - name: "QM Status"
      description: "QM Status indicator"
      quote: true
      dataType:
        type: "String"
    - name: "Qualification Method"
      description: "Type of payment used to qualify the borrower for the loan."
      quote: true
      dataType:
        type: "String"
    - name: "Rate Type"
      description: "Classification of the interest rate structure type for the loan\
        \ (e.g., Fixed, ARM, or other rate type variants)."
      quote: true
      dataType:
        type: "String"
    - name: "Relocation Flag"
      description: "Indicates whether the loan is part of a corporate relocation program."
      quote: true
      dataType:
        type: "Boolean"
    - name: "Remaining Prepayment Penalty Period"
      description: "Number of months that a prepayment penalty remains in effect on\
        \ the loan"
      quote: true
      dataType:
        type: "Integer"
    - name: "Self-Employment Flag"
      description: "Indicator of whether the primary borrower is self-employed"
      quote: true
      dataType:
        type: "Boolean"
    - name: "Seller"
      description: "Identifier for the seller entity in a transaction or deal."
      dataType:
        type: "String"
    - name: "Seller Loan ID"
      description: "Unique identifier for a loan assigned or tracked by the seller\
        \ entity"
      tags:
      - "column:Seller_Loan_ID"
      tests:
      - unique:
          config:
            fail_calc: "count(*)"
            tags:
            - "test:unique"
      quote: true
      dataType:
        type: "String"
    - name: "Seller Product Type"
      description: "Identifies the product type of the loan as classified by the seller,\
        \ typically derived from loan structure parameters (fixed rate period, amortization\
        \ type, original term)."
      quote: true
      dataType:
        type: "String"
    - name: "Senior Lien Current Balance"
      description: "Outstanding balance amount on the senior (primary) mortgage lien\
        \ at current point in time"
      quote: true
      dataType:
        type: "Float"
    - name: "Senior Lien Hybrid Period"
      description: "Duration of the hybrid period for the most senior lien, expressed\
        \ in months"
      quote: true
      dataType:
        type: "Integer"
    - name: "Senior Lien Loan Type"
      description: "Classification or identifier of the loan type associated with\
        \ the senior lien position in a mortgage structure."
      quote: true
      dataType:
        type: "String"
    - name: "Senior Lien Neg Am Limit"
      description: "Limit amount for senior lien negative amortization"
      quote: true
      dataType:
        type: "Integer"
    - name: "Senior Lien Original Balance"
      description: "For subordinate mortgages, the aggregate original balance of all\
        \ senior mortgages at the time the junior lien originated."
      quote: true
      dataType:
        type: "Float"
    - name: "Servicer Name"
      description: "Company that has or will have the right to service the loan."
      quote: true
      dataType:
        type: "String"
    - name: "Short Term Rental Flag"
      description: "Indicator of whether investment properties are already leased\
        \ on a short-term basis."
      quote: true
      dataType:
        type: "Boolean"
    - name: "Subseq NegAm Recast Period"
      description: "Identifies the subsequent negative amortization recast period\
        \ for a loan product."
      quote: true
      dataType:
        type: "Integer"
    - name: "Subseq Payment Reset Period"
      description: "Represents the period or interval for resetting subsequent payments\
        \ in a negative amortization context."
      quote: true
      dataType:
        type: "Integer"
    - name: "Subseq Periodic Pay Cap"
      description: "Captures the periodic payment cap applied to subsequent payment\
        \ periods in negative amortization scenarios."
      quote: true
      dataType:
        type: "Integer"
    - name: "Svc Advance Method"
      description: "The manner in which principal and/or interest are to be advanced\
        \ by the servicer."
      quote: true
      dataType:
        type: "String"
    - name: "Svc Fee Amt ($)"
      description: "Aggregate monthly fee paid to all servicers, expressed as a dollar\
        \ amount."
      quote: true
      dataType:
        type: "Integer"
    - name: "Svc Fee Rate (%)"
      description: "Aggregate monthly fee paid to all servicers, expressed as a percentage\
        \ in decimal form."
      quote: true
      dataType:
        type: "Integer"
    - name: "Total Combined Monthly Income"
      description: "Monthly gross income of all borrowers combined"
      quote: true
      dataType:
        type: "Float"
    - name: "Total Combined Wage Income"
      description: "Monthly income of all borrowers derived from base salary only."
      quote: true
      dataType:
        type: "Integer"
    - name: "Years in Home"
      description: "Numeric measure of the duration (in years) that the borrower has\
        \ resided at their current home address."
      quote: true
      dataType:
        type: "Integer"
    type: "table"
