    tables:
    - name: all_cols
      schema:
        entityType: ''
        providerType: databricks
        fields:
        - name: 4506T Flag
          dataType:
            type: Boolean
          description: Boolean indicator of whether a Transcript of Tax Return (received
            pursuant to the filing of IRS Form 4506-T) was obtained and considered.
        - name: ARM Index
          dataType:
            type: String
          description: Specifies the type of index used to determine the interest
            rate at each adjustment period for adjustable rate mortgages.
        - name: ARM Initial Fixed Rate Period
          dataType:
            type: Integer
          description: Original number of months until the first rate adjustment in
            a hybrid adjustable-rate mortgage (e.g., 5/25 ARM)
        - name: ARM Initial Rate Adj Cap
          dataType:
            type: Integer
          description: Maximum percentage by which the note rate may change at the
            first rate adjustment date in an adjustable-rate mortgage.
        - name: ARM Lookback Days
          dataType:
            type: Integer
          description: The number of days prior to the interest rate adjustment date
            to retrieve the index value.
        - name: ARM Margin
          dataType:
            type: Integer
          description: The percentage spread between the ARM Index value and the mortgage
            interest rate, as stated on the mortgage note.
        - name: ARM Max Rate
          dataType:
            type: Integer
          description: The maximum interest rate that can be in effect during the
            life of an adjustable-rate mortgage (ARM) loan.
        - name: ARM Min Rate
          dataType:
            type: Integer
          description: The minimum interest rate that can be in effect during the
            life of an adjustable-rate mortgage (ARM) loan; also known as the lifetime
            floor rate.
        - name: ARM Periodic Cap
          dataType:
            type: Integer
          description: Maximum percentage by which the note rate may change at each
            rate adjustment date in an adjustable rate mortgage (ARM).
        - name: ARM Rate Adj Frequency
          dataType:
            type: Integer
          description: Specifies the number of months between each subsequent rate
            adjustment in an adjustable-rate mortgage (ARM) product.
        - name: ARM Round Factor
          dataType:
            type: Integer
          description: The percentage to which an adjusted interest rate is to be
            rounded in adjustable rate mortgage products.
        - name: ARM Round Flag
          dataType:
            type: Boolean
          description: Indicator of the rounding method applied to an adjusted interest
            rate in an ARM (Adjustable Rate Mortgage), specifying whether rounding
            occurs to the next higher round factor, next lower round factor, or nearest
            round factor.
        - name: As Of Date
          dataType:
            type: Date
          description: Reference date for loan balance, servicing metrics, and other
            reported data; typically the month-end or reporting cutoff date.
        - name: BPO Date
          dataType:
            type: Date
          description: Internal SItusAMC data point representing the current valuation
            date of the property across all data sources.
        - name: BPO Value
          dataType:
            type: Float
          description: Current valuation of the property from Broker Price Opinion
            (BPO) data across all available sources
        - name: Borr 1 Asset Verification
          dataType:
            type: String
          description: Indicates the extent to which the primary borrower's assets
            have been verified.
        - name: Borr 1 Credit Score
          dataType:
            type: Integer
          description: Most recent primary borrower credit score (FICO)
        - name: Borr 1 Credit Score Date
          dataType:
            type: Date
          description: Date on which the most recent primary borrower's credit score
            (FICO) was obtained
        - name: Borr 1 Employment Verification
          dataType:
            type: String
          description: Indicates the extent to which the primary borrower's employment
            has been verified
        - name: Borr 1 Income Verification
          dataType:
            type: String
          description: Indicates the extent to which the primary borrower's income
            has been verified.
        - name: Borr 1 Length of Employment
          dataType:
            type: Integer
          description: The number of years of service with the primary borrower's
            current employer as of the loan date.
        - name: Borr 1 Other Income
          dataType:
            type: Integer
          description: Monthly non-wage income amount for the primary borrower.
        - name: Borr 1 Residency Status
          dataType:
            type: String
          description: Classification of the primary borrower's residency and citizenship
            status (e.g., US Citizen, Foreign National, Permanent Resident)
        - name: Borr 1 Wage Income
          dataType:
            type: Integer
          description: Monthly base wage income for the primary borrower.
        - name: Borr 2 Asset Verification
          dataType:
            type: String
          description: Asset verification status or classification for the second
            borrower in a loan application.
        - name: Borr 2 Credit Score
          dataType:
            type: Integer
          description: Most recent credit score for the co-borrower (secondary borrower)
        - name: Borr 2 Employment Verification
          dataType:
            type: String
          description: Employment verification status or method for the second borrower
        - name: Borr 2 Income Verification
          dataType:
            type: String
          description: Verification status or level of income documentation for a
            co-borrower or second borrower
        - name: Borr 2 Length of Employment
          dataType:
            type: Integer
          description: The number of years of service with the co-borrower's current
            employer as of the loan date.
        - name: Borr 2 Other Income
          dataType:
            type: Integer
          description: Monthly other (non-wage) income for all other borrowers (co-borrowers).
        - name: Borr 2 Residency Status
          dataType:
            type: String
          description: Classification of coborrower (secondary borrower) residency
            and citizenship status (e.g., US Citizen, Foreign National, Permanent
            Resident)
        - name: Borr 2 Wage Income
          dataType:
            type: Integer
          description: Monthly base wage income for all other borrowers (co-borrowers).
        - name: Broker Flag
          dataType:
            type: Boolean
          description: Indicates whether a broker took the application.
        - name: Buydown Period
          dataType:
            type: Integer
          description: Term in months for how long the rate of the loan has been temporarily
            bought down to a lower coupon
        - name: 'CRE Financials: UW DSCR (NOI)'
          dataType:
            type: Integer
          description: Underwritten or Original Debt Service Coverage Ratio calculated
            based on Net Operating Income
        - name: Cash Out Amount
          dataType:
            type: Float
          description: 'The net cash amount disbursed to borrower in a cash-out refinance,
            calculated as: New Loan Amount minus Paid-Off Senior Loan Amount minus
            Paid-Off Junior Loan Amounts minus Closing Costs'
        - name: Credit Line Usage Ratio
          dataType:
            type: Integer
          description: Measure of credit utilization, calculated as the sum of credit
            balances divided by sum of total open credit available.
        - name: 'Credit: Longest Trade Line'
          dataType:
            type: Integer
          description: Credit bureau information representing the age or duration
            of the longest active trade line on the borrower's credit profile
        - name: 'Credit: Maximum Trade Line'
          dataType:
            type: Float
          description: Maximum trade line amount from credit bureau information
        - name: 'Credit: Number of Trade Lines'
          dataType:
            type: Integer
          description: Count of open trade lines from credit bureau data; indicates
            borrower's active credit accounts
        - name: Curr Balloon Flag
          dataType:
            type: Boolean
          description: Indicator of whether there is a scheduled balloon payment for
            the loan.
        - name: Curr CLTV
          dataType:
            type: Integer
          description: Current Combined Loan-to-Value ratio; represents the sum of
            senior and junior unpaid principal balance divided by current property
            value
        - name: Curr LTV
          dataType:
            type: Integer
          description: Current Loan-to-Value ratio; represents current outstanding
            principal balance divided by current property value
        - name: Curr Loan Balance
          dataType:
            type: Float
          description: Unpaid principal balance of the current loan, excluding deferred
            or non-interest accruing amounts
        - name: Curr Loan Interest Rate
          dataType:
            type: Integer
          description: The interest rate used to calculate the current principal and
            interest payment on the loan.
        - name: Curr Occupancy Status
          dataType:
            type: String
          description: Latest occupancy status indicating whether a property is occupied
            by owner, second home, or investor
        - name: Curr PI Payment
          dataType:
            type: Float
          description: Contractual monthly Principal and Interest payment amount
        - name: Curr Payment Paid Thru Date
          dataType:
            type: Date
          description: The date through which all principal and interest payments
            have been paid up to; typically one period behind the next due date for
            active loans.
        - name: Curr Servicer Delinquency Status
          dataType:
            type: String
          description: Represents the current delinquency status of a loan as reported
            by the servicer. Raw indicator used to derive or validate loan status,
            particularly in RMBS contexts.
        - name: Current FICO
          dataType:
            type: Integer
          description: Current FICO credit score of the borrower; represents the most
            recent credit rating used in underwriting.
        - name: Current FICO Date
          dataType:
            type: Date
          description: The date associated with the most recent FICO credit score
            for the primary borrower.
        - name: Current Other Payment
          dataType:
            type: Float
          description: Monetary amount representing current other payments (non-primary
            payment obligations).
        - name: Current Payment Amount Due
          dataType:
            type: Float
          description: The monetary amount currently due as a payment obligation.
        - name: 'DD: Compliance Event Grade'
          dataType:
            type: String
          description: Grade or rating assigned to a compliance event identified during
            due diligence review of a loan.
        - name: 'DD: Credit Event Grade'
          dataType:
            type: String
          description: Classification or grading of credit events identified during
            due diligence review of a loan.
        - name: 'DD: Overall Grade'
          dataType:
            type: String
          description: Overall grade or rating assessment from due diligence process
        - name: 'DD: Property Event Grade'
          dataType:
            type: String
          description: Due diligence assessment grade for a property event, used in
            loan review processes.
        - name: DTI Ratio
          dataType:
            type: Integer
          description: Back-end debt-to-income ratio; total monthly debt expense divided
            by total monthly income, used for loan qualification
        - name: Doc Type
          dataType:
            type: String
          description: Documentation level classification at loan origination (e.g.,
            Full, Stated, Limited, No Doc, SISA).
        - name: Escrow Advance Balance
          dataType:
            type: Float
          description: Funds advanced for taxes and insurance held in escrow account
        - name: Escrow Flag
          dataType:
            type: Boolean
          description: Indicates whether homeownership expenses are paid by the borrower
            directly or through an escrow account at securitization cut-off date.
        - name: 'Financing: Advance Rate'
          dataType:
            type: Integer
          description: Advance Rate for WAM (Warehouse) financing terms
        - name: First-time Home Buyer
          dataType:
            type: Boolean
          description: Indicator of whether the borrower is a first-time home buyer.
        - name: Forbearance Type
          dataType:
            type: String
          description: Categorical indicator of the type of forbearance granted on
            a student loan account.
        - name: High Cost Flag
          dataType:
            type: Boolean
          description: Indicator of whether a loan is classified as a federal or state
            high cost loan.
        - name: Init Fixed Payment Period
          dataType:
            type: Integer
          description: Specifies the initial period during which fixed payments are
            applied (relevant to negative amortization loan products).
        - name: Init Min Payment
          dataType:
            type: Integer
          description: Initial minimum payment amount for a loan or mortgage product.
        - name: Init NegAm Recast Period
          dataType:
            type: Integer
          description: Represents the initial negative amortization recast period,
            calculated as the number of months between the original first payment
            date and the negative amortization initial recast date.
        - name: Init Periodic Pay Cap
          dataType:
            type: Integer
          description: Initial periodic payment cap value for negative amortization
            loans
        - name: LOC Draw Period
          dataType:
            type: Integer
          description: Duration period during which funds can be drawn from a Line
            of Credit, expressed in months
        - name: Lien Position
          dataType:
            type: String
          description: Numeric indicator of the loan's lien position in the mortgage
            hierarchy (1 = first lien, 2 = second lien, etc.)
        - name: Line of Credit Flag
          dataType:
            type: Boolean
          description: Indicator that loan has a Line of Credit feature (HELOCs, Reverse
            mortgages, etc.)
        - name: Liquid / Cash Reserves
          dataType:
            type: Float
          description: Dollar amount of remaining verified liquid assets available
            after settlement, excluding cash-out from the subject loan.
        - name: Loan Purpose
          dataType:
            type: String
          description: Indicates the purpose of the loan (e.g., purchase, refinance,
            cash-out).
        - name: MI Cert Num
          dataType:
            type: String
          description: The unique number assigned to each individual loan insured
            under a mortgage insurance (MI) policy.
        - name: MI Company
          dataType:
            type: String
          description: The name of the entity providing mortgage insurance for a loan.
        - name: MI Coverage Pct
          dataType:
            type: Integer
          description: Mortgage Insurance coverage percentage.
        - name: Mod Capitalized Amount
          dataType:
            type: Float
          description: The principal amount capitalized (added to loan balance) as
            part of a loan modification, typically in distressed servicing scenarios.
        - name: Mod Deferred Amount
          dataType:
            type: Float
          description: Dollar amount of principal or payments deferred as part of
            a loan modification.
        - name: Modification Flag
          dataType:
            type: Boolean
          description: Indicator that the loan has been modified.
        - name: Monthly Debt All Borrowers
          dataType:
            type: Float
          description: Aggregate monthly debt service obligations across all borrowers
            on the loan.
        - name: Months Since BK Discharge
          dataType:
            type: Integer
          description: Number of months elapsed since any borrower was discharged
            from bankruptcy
        - name: Months Since FC Sale
          dataType:
            type: Integer
          description: Number of months elapsed since the foreclosure sale date.
        - name: NegAm Limit
          dataType:
            type: Integer
          description: Negative amortization limit, maximum, or cap threshold for
            a loan product
        - name: Number Of Properties
          dataType:
            type: Integer
          description: Count of properties associated with a loan or borrower collateral
            portfolio
        - name: Number of Borrowers
          dataType:
            type: Integer
          description: Count of borrowers obligated to repay the note
        - name: OptionARM Flag
          dataType:
            type: Boolean
          description: Indicator of whether a loan product is an Option ARM (Negative
            Amortization Adjustable Rate Mortgage).
        - name: Orig Amortization Term
          dataType:
            type: Integer
          description: The number of months over which the loan principal and interest
            would be fully amortized with regular monthly payments. Typically shorter
            than total loan term for balloon loans.
        - name: Orig Amortization Type
          dataType:
            type: String
          description: Identifies the original amortization schedule type for a loan
            (Fixed, Adjustable/ARM, Balloon, etc.)
        - name: Orig Appraisal Date
          dataType:
            type: Date
          description: The appraised value date of the property used to approve the
            loan at origination.
        - name: Orig Appraisal Value
          dataType:
            type: Float
          description: The appraised value of the property used to approve the loan.
        - name: Orig CLTV
          dataType:
            type: Integer
          description: Combined Loan-to-Value ratio; calculated as the sum of all
            loan liens divided by the lesser of original sales price or appraised
            value.
        - name: Orig Channel
          dataType:
            type: String
          description: The source or channel through which the mortgage loan was originated
            (e.g., Retail, Broker, etc.)
        - name: Orig First Payment Date
          dataType:
            type: Date
          description: The date of the first scheduled payment to be made by the borrower
            as specified on the note at loan origination.
        - name: Orig Interest Only Term
          dataType:
            type: Integer
          description: Original interest-only period for a loan, measured in months.
            Applies to all loan types including Negative Amortization loans.
        - name: Orig Junior Loan Amount
          dataType:
            type: Float
          description: Combined balance of subordinate liens (junior mortgages) at
            the time of origination for first mortgages with multiple liens.
        - name: Orig LTV
          dataType:
            type: Integer
          description: Original Loan-to-Value ratio; calculated as Original Loan Amount
            divided by the lesser of Original Sales Price or Original Appraisal Value.
            Represents the leverage at origination of the mortgage.
        - name: Orig Loan Amount
          dataType:
            type: Float
          description: Dollar amount of the loan as specified on the note at origination.
            For HELOCs, represents the maximum available line of credit. For Reverse
            mortgages, represents the Initial Advance Amount.
        - name: Orig Loan Interest Rate
          dataType:
            type: Integer
          description: The original note rate at loan origination
        - name: Orig Loan Maturity Date
          dataType:
            type: Date
          description: The original maturity date of the loan, calculated from loan
            origination parameters or sourced from loan modification records.
        - name: Orig Loan Term
          dataType:
            type: Integer
          description: The initial number of months between loan origination and loan
            maturity date as specified on the note (Term to Maturity).
        - name: Orig Pledged Assets
          dataType:
            type: Integer
          description: The total value of assets pledged as collateral for the loan
            at the time of origination.
        - name: Orig Sales Price
          dataType:
            type: Float
          description: The original sales price of the property at time of purchase.
        - name: Original FICO
          dataType:
            type: Integer
          description: The original FICO credit score used for loan qualification
            of the borrower.
        - name: Original FICO Date
          dataType:
            type: Date
          description: The date on which the original FICO credit score was obtained
            or calculated for the borrower.
        - name: Origination Discount Points ($)
          dataType:
            type: Float
          description: Amount paid to lender to increase effective yield and reduce
            borrower interest rate
        - name: Origination Note Date
          dataType:
            type: Date
          description: The date on which the loan was originated (note date).
        - name: Originator Loan Grade
          dataType:
            type: String
          description: Loan grade assigned by the originator
        - name: Originator Name
          dataType:
            type: String
          description: Entity that lends funds to the borrower
        - name: Originator Program
          dataType:
            type: String
          description: Identifies the origination program or product type associated
            with the loan.
        - name: Pay History 12 Mths
          dataType:
            type: String
          description: Encodes the payment status or payment record for the past 12
            months in string format
        - name: Pay History 24 Mths
          dataType:
            type: String
          description: Represents payment status history over the past 24 months as
            a coded string
        - name: Pay History Current for 24
          dataType:
            type: Boolean
          description: Indicator of whether the loan has maintained current payment
            status for the last 24 months (Y/N).
        - name: Prepayment Penalty Description
          dataType:
            type: String
          description: Textual description of how prepayment penalties are calculated
            across different phases of the prepayment penalty term.
        - name: Prepayment Penalty Hard Term
          dataType:
            type: Integer
          description: Specifies the hard term duration for prepayment penalties on
            the loan, indicating the period during which prepayment penalties are
            fixed and non-negotiable.
        - name: Prepayment Penalty Period
          dataType:
            type: Integer
          description: The total number of months during which a prepayment penalty
            may be in effect on a loan.
        - name: Property City
          dataType:
            type: String
          description: The city or municipality where the property is located.
        - name: Property State
          dataType:
            type: String
          description: US state location of the property being financed or evaluated.
        - name: Property Type
          dataType:
            type: String
          description: Categorical identifier of the property type (e.g., single-family,
            condo, PUD).
        - name: Property Zip
          dataType:
            type: String
          description: Postal zip code of the property location.
        - name: QM Status
          dataType:
            type: String
          description: QM Status indicator
        - name: Qualification Method
          dataType:
            type: String
          description: Type of payment used to qualify the borrower for the loan.
        - name: Rate Type
          dataType:
            type: String
          description: Classification of the interest rate structure type for the
            loan (e.g., Fixed, ARM, or other rate type variants).
        - name: Relocation Flag
          dataType:
            type: Boolean
          description: Indicates whether the loan is part of a corporate relocation
            program.
        - name: Remaining Prepayment Penalty Period
          dataType:
            type: Integer
          description: Number of months that a prepayment penalty remains in effect
            on the loan
        - name: Self-Employment Flag
          dataType:
            type: Boolean
          description: Indicator of whether the primary borrower is self-employed
        - name: Seller
          dataType:
            type: String
          description: Identifier for the seller entity in a transaction or deal.
        - name: Seller Loan ID
          dataType:
            type: String
          description: Unique identifier for a loan assigned or tracked by the seller
            entity
        - name: Seller Product Type
          dataType:
            type: String
          description: Identifies the product type of the loan as classified by the
            seller, typically derived from loan structure parameters (fixed rate period,
            amortization type, original term).
        - name: Senior Lien Current Balance
          dataType:
            type: Float
          description: Outstanding balance amount on the senior (primary) mortgage
            lien at current point in time
        - name: Senior Lien Hybrid Period
          dataType:
            type: Integer
          description: Duration of the hybrid period for the most senior lien, expressed
            in months
        - name: Senior Lien Loan Type
          dataType:
            type: String
          description: Classification or identifier of the loan type associated with
            the senior lien position in a mortgage structure.
        - name: Senior Lien Neg Am Limit
          dataType:
            type: Integer
          description: Limit amount for senior lien negative amortization
        - name: Senior Lien Original Balance
          dataType:
            type: Float
          description: For subordinate mortgages, the aggregate original balance of
            all senior mortgages at the time the junior lien originated.
        - name: Servicer Name
          dataType:
            type: String
          description: Company that has or will have the right to service the loan.
        - name: Short Term Rental Flag
          dataType:
            type: Boolean
          description: Indicator of whether investment properties are already leased
            on a short-term basis.
        - name: Subseq NegAm Recast Period
          dataType:
            type: Integer
          description: Identifies the subsequent negative amortization recast period
            for a loan product.
        - name: Subseq Payment Reset Period
          dataType:
            type: Integer
          description: Represents the period or interval for resetting subsequent
            payments in a negative amortization context.
        - name: Subseq Periodic Pay Cap
          dataType:
            type: Integer
          description: Captures the periodic payment cap applied to subsequent payment
            periods in negative amortization scenarios.
        - name: Svc Advance Method
          dataType:
            type: String
          description: The manner in which principal and/or interest are to be advanced
            by the servicer.
        - name: Svc Fee Amt ($)
          dataType:
            type: Integer
          description: Aggregate monthly fee paid to all servicers, expressed as a
            dollar amount.
        - name: Svc Fee Rate (%)
          dataType:
            type: Integer
          description: Aggregate monthly fee paid to all servicers, expressed as a
            percentage in decimal form.
        - name: Total Combined Monthly Income
          dataType:
            type: Float
          description: Monthly gross income of all borrowers combined
        - name: Total Combined Wage Income
          dataType:
            type: Integer
          description: Monthly income of all borrowers derived from base salary only.
        - name: Years in Home
          dataType:
            type: Integer
          description: Numeric measure of the duration (in years) that the borrower
            has resided at their current home address.
